<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Notes App</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: sans-serif; background: #f4f4f4; padding: 40px; }
      h1 { margin-bottom: 24px; }

      .form { background: white; padding: 20px; border-radius: 8px; margin-bottom: 32px; display: flex; flex-direction: column; gap: 10px; max-width: 500px; }
      .form input, .form textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      .form textarea { resize: vertical; height: 80px; }
      .form button { padding: 10px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
      .form button:hover { background: #555; }

      .notes { display: flex; flex-direction: column; gap: 12px; max-width: 500px; }
      .note { background: white; padding: 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
      .note-content h3 { margin-bottom: 4px; }
      .note-content p { color: #666; font-size: 14px; }
      .note-actions { display: flex; gap: 8px; }
      .note-actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .btn-delete { background: #e74c3c; color: white; }
      .btn-edit { background: #3498db; color: white; }
      .btn-delete:hover { background: #c0392b; }
      .btn-edit:hover { background: #2980b9; }
    </style>
  </head>
  <body>
    <h1>Notes</h1>

    <div class="form">
      <input type="text" id="title" placeholder="Title" />
      <textarea id="body" placeholder="Note content"></textarea>
      <button onclick="saveNote()">Save Note</button>
    </div>

    <div class="notes" id="notes-list"></div>

    <script>
      let editingId = null;

      async function loadNotes() {
        const res = await fetch("/notes");
        const notes = await res.json();
        const list = document.getElementById("notes-list");
        list.innerHTML = "";
        notes.forEach((note) => {
          list.innerHTML += `
            <div class="note">
              <div class="note-content">
                <h3>${note.title}</h3>
                <p>${note.body}</p>
              </div>
              <div class="note-actions">
                <button class="btn-edit" onclick="editNote(${note.id}, '${note.title}', '${note.body}')">Edit</button>
                <button class="btn-delete" onclick="deleteNote(${note.id})">Delete</button>
              </div>
            </div>`;
        });
      }

      async function saveNote() {
        const title = document.getElementById("title").value;
        const body = document.getElementById("body").value;
        if (!title || !body) return alert("Fill in both fields");

        if (editingId) {
          await fetch(`/notes/${editingId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, body }),
          });
          editingId = null;
        } else {
          await fetch("/notes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, body }),
          });
        }

        document.getElementById("title").value = "";
        document.getElementById("body").value = "";
        loadNotes();
      }

      function editNote(id, title, body) {
        editingId = id;
        document.getElementById("title").value = title;
        document.getElementById("body").value = body;
      }

      async function deleteNote(id) {
        await fetch(`/notes/${id}`, { method: "DELETE" });
        loadNotes();
      }

      loadNotes();
    </script>
  </body>
</html>
